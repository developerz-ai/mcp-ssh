# Weekly, grouped, quiet (owner, 2026-11-26: "not so damn much daily prs"). Every ecosystem runs
# Monday. Minor and patch updates arrive as one PR per ecosystem, security updates as one more; a
# major update arrives on its own. The developerz.ai maintainer agent reviews, fixes and merges every
# Dependabot PR (.dz/maintainer/maintainer.yml); its own advisory watch is off, so this file is the
# one dependency-advisory lane.
# The 14-day cooldown lets a compromised release get caught before it reaches us. Security updates
# are unaffected.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    # The builder's Rust version must equal rust-toolchain.toml and Cargo.toml
    # `rust-version`; Dependabot can't bump those, so toolchain bumps are manual.
    ignore:
      - dependency-name: "lukemathwalker/cargo-chef"
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
