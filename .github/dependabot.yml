# Cargo weekly; Docker and GitHub Actions monthly (as in developerz-ai/wurk: a weekly cadence there is
# mostly one PR per patch release for no change in what ships). Minor and patch updates are grouped
# per ecosystem; a major update arrives on its own. The developerz.ai maintainer agent reviews,
# fixes and merges every Dependabot PR (.dz/maintainer/maintainer.yml).
# The 14-day cooldown lets a compromised release get caught before it reaches us. Security updates
# are unaffected.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/apps/mcp-ssh"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    cooldown:
      default-days: 14
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/apps/mcp-ssh"
    schedule:
      interval: "monthly"
      time: "10:00"
    cooldown:
      default-days: 14
    # The builder's Rust version must equal rust-toolchain.toml and Cargo.toml
    # `rust-version`; Dependabot can't bump those, so toolchain bumps are manual.
    ignore:
      - dependency-name: "lukemathwalker/cargo-chef"
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "10:00"
    cooldown:
      default-days: 14
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
