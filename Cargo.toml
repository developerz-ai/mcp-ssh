[package]
name = "mcp-ssh"
version = "2.0.0"
edition = "2024"
rust-version = "1.100"  # = rust-toolchain.toml + Dockerfile base; bump together
description = "Remote shell + file access for AI agents over authenticated MCP-HTTP — an ssh replacement you talk to over /mcp"
license = "MIT"
repository = "https://github.com/developerz-ai/mcp-ssh"
readme = "README.md"
publish = false

[[bin]]
name = "mcp-ssh"
path = "src/main.rs"

[dependencies]
# MCP server + Streamable HTTP transport
rmcp = { version = "3.8", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
] }

# async runtime + http
tokio = { version = "1", features = ["full"] }
# `CancellationToken` — the handle rmcp's Streamable HTTP config takes to end
# every open SSE stream on shutdown (already in the tree via rmcp).
tokio-util = "0.7"
axum = "0.8"

# serialization + tool schemas
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# kill(2) for job process groups — a direct syscall, no external `kill` binary
libc = "0.2"

# time — local HH:MM stamped into human-readable job ids
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# durable state: OAuth tokens/refresh + job metadata + saved output tails.
# `bundled` compiles SQLite into the binary (no system libsqlite dep), keeping
# the single-binary deploy. Accessed via spawn_blocking — see `src/db.rs`.
rusqlite = { version = "0.42", features = ["bundled"] }

# cli + config
clap = { version = "4", features = ["derive"] }
toml = "1.1"
rpassword = "7"

# auth (opaque tokens + PKCE S256 — no JWT/JWKS needed)
base64 = "0.23"
sha2 = "0.11"
rand = "0.10"
urlencoding = "2"

# errors + logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# error-tracking event scrubbing (credential redaction before send). Already a
# transitive dep of `sentry`; declared so `src/sentry.rs` can name it directly.
regex = "1"

# error tracking → GlitchTip (Sentry-protocol). rustls transport, never
# native-tls: `default-features = false` drops `native-tls` + `debug-images`
# (both default). Re-enable only error-tracking integrations + reqwest/rustls.
sentry = { version = "0.49", default-features = false, features = [
    "reqwest",
    "rustls",
    "backtrace",
    "contexts",
    "panic",
] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["test-util"] }
# tests/e2e: real HTTP against the spawned binary. Already in the tree via
# `sentry` (rustls, no native-tls); form/query add only serde_urlencoded.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# `cargo deb` packaging — produces the downloadable .deb.
[package.metadata.deb]
maintainer = "developerz-ai <admin@venom.is>"
copyright = "2026, developerz-ai"
extended-description = "An MCP server giving an AI agent remote shell + file access to the host it runs on, over authenticated MCP-HTTP at /mcp."
depends = "$auto, adduser"  # postinst calls addgroup/adduser
section = "utils"
priority = "optional"
assets = [
    ["target/release/mcp-ssh", "usr/bin/", "755"],
    ["deploy/mcp-ssh.service", "lib/systemd/system/", "644"],
    ["README.md", "usr/share/doc/mcp-ssh/README.md", "644"],
]
systemd-units = { unit-name = "mcp-ssh", enable = false, start = false }
# postinst creates the `mcp-ssh` system user/group the unit runs as and the
# /etc/mcp-ssh config dir (0750) — without it the unit fails with 217/USER.
maintainer-scripts = "deploy/debian/"
