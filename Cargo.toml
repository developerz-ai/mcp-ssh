# Virtual workspace: the mcp-ssh package lives in apps/mcp-ssh/ (its Cargo.toml
# carries the package body this file used to hold).
[workspace]
resolver = "2"
members = ["apps/mcp-ssh"]

# cargo honors [profile.*] only in the workspace root, never in a member
# manifest — the release profile stays here.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Keep in sync: cargo keeps one Cargo.lock per workspace at the root — this one
# serves --locked workspace builds (bin/check, CI, cargo deb) while
# apps/mcp-ssh/Cargo.lock is the standalone lock the Docker build reads (build
# context apps/mcp-ssh). After any dependency change, copy this file over
# apps/mcp-ssh/Cargo.lock.
