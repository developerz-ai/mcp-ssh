notes: |
  Owner decisions taken: delete of a non-empty dir needs recursive=true; unknown job action string -> error, deny_unknown_fields on all args; reaper ages from finish and never kills; atomic write; consent page; no argon2 (redacted Debug + parse-error scrub only); SHA-256 token hashing (one-time logout); 90-day refresh family; 256 MiB live log cap; ProtectSystem only in the lockdown drop-in; LOC rule = <=300 non-test LOC, tests in a sibling tests.rs.
  Deferred (not fixed by 01–07; each needs its own change):
  - Interactive job surviving a restart is killed from its persisted row without the leader SIGSTOP (kill_persisted always uses Kill::Graceful): needs an `interactive` column on jobs.
  - A failed kill can leave the row reading killed: the kill_reason is set before the escalation, so a group that Survived/NotSignalled and later exits on its own is recorded "killed".
  - Docker `ProtectSystem`/sudo interaction and UMask removal not verified on a live systemd box.
  - The 256 MiB live log cap is enforced only while the job's leader runs; leftovers (`server &`) still writing after the leader exits are not capped.
  - rmcp rejects malformed tool args (deny_unknown_fields, bad types) before dispatch, so those calls get no tool span and no outcome log line.
  - A16 (cross-process stream close): bearers are validated per HTTP request only, so an SSE stream opened before a token expired or was revoked (`sessions --revoke` / `set-auth` run as another process) is not closed; new requests on it are refused. Unverified how long rmcp keeps such a stream.
  - ProtectSystem-vs-sudo (06) and the unit's sudo self-management were reasoned from systemd semantics, not verified on a live box.
